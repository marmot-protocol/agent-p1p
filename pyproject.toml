[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-p1p"
version = "0.1.0"
description = "Repository-scoped orchestration and role contracts for Pip"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.scripts]
pip-v2-bootstrap = "pip_agent.bootstrap:main"
pip-v2-cursor = "pip_agent.cursor_adapter:main"
pip-v2-fixture = "pip_agent.offline_fixture:main"
pip-v2-intake = "pip_agent.intake:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pip_agent"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "pip_agent/schemas"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
