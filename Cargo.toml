[workspace]
members = ["crates/pip-contracts", "crates/pip-core", "crates/pip-store"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
version = "0.1.0"

[workspace.dependencies]
proptest = "1.9.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
