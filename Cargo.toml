[workspace]
members = ["crates/pip-contracts", "crates/pip-control", "crates/pip-controller", "crates/pip-core", "crates/pip-executor", "crates/pip-github", "crates/pip-hermes", "crates/pip-store"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
proptest = "1.9.0"
hmac = "0.13.0"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.1", features = ["timeout"] }
ureq = "3.4.0"
wait-timeout = "0.2.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
